<!doctype html>
<html lang="mn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Сүлжээ алга — Nemi CRM</title>
    <style>
      body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #fff; color: #0f172a; display: grid; place-items: center; min-height: 100vh; }
      main { max-width: 22rem; padding: 1.5rem; text-align: center; }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { font-size: 1.25rem; margin: 1rem 0 0.5rem; }
      p { color: #64748b; font-size: 0.95rem; line-height: 1.5; }
      button { margin-top: 1rem; height: 2.75rem; padding: 0 1.25rem; border: 0; border-radius: 0.75rem; background: #f97316; color: #fff; font-size: 1rem; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Сүлжээ алга байна</h1>
      <p>Интернэт холболтоо шалгаад дахин оролдоно уу. Бүртгэлээ сүлжээ сэргэсний дараа хийнэ үү.</p>
      <button type="button" onclick="location.reload()">Дахин оролдох</button>
    </main>
  </body>
</html>
