# Mobile CI (Phase 0 checklist): flutter analyze + test + build
# + taxonomy contract test (staging distinct type/district vs Dart constants).
#
# ШААРДЛАГА: repo Settings → Secrets-д STAGING_SUPABASE_URL,
# STAGING_SUPABASE_ANON_KEY нэмэх (nemi_mobile/env/ нь gitignored тул).
# Secrets байхгүй бол contract тест өөрөө skip хийнэ (fail болохгүй).
name: Mobile CI

on:
  push:
    branches: [main]
    paths: ['nemi_mobile/**', '.github/workflows/mobile-ci.yml']
  pull_request:
    paths: ['nemi_mobile/**', '.github/workflows/mobile-ci.yml']

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nemi_mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # env/ нь gitignored — CI дээр secrets-ээс бүтээнэ.
      - name: Write env/staging.json from secrets
        run: |
          mkdir -p env
          cat > env/staging.json <<EOF
          {
            "SUPABASE_URL": "${{ secrets.STAGING_SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ secrets.STAGING_SUPABASE_ANON_KEY }}"
          }
          EOF

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Unit tests
        run: flutter test --no-pub

      - name: Contract test (taxonomy drift vs staging)
        run: >
          flutter test --no-pub
          --dart-define-from-file=env/staging.json
          test/contract/taxonomy_contract_test.dart

      - name: Build APK (debug)
        run: flutter build apk --debug --dart-define-from-file=env/staging.json
